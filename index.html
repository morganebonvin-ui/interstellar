<!DOCTYPE html>
<!--
  ============================================================================
  DASHBOARD PERSONNEL POUR IPAD 4 (iOS 10.3.3 / Safari mobile ancien)
  ============================================================================
  Ce fichier est 100% autonome : un seul index.html avec le CSS et le JS
  intégrés. Vous pouvez l'héberger tel quel sur GitHub Pages.

  IMPORTANT POUR LE NÉOPHYTE :
  - Tout le JavaScript est écrit en syntaxe "ancienne" (ES5) : var au lieu
    de let/const, function() au lieu de () =>, concaténation de chaînes
    avec "+" au lieu des templates `${}`. C'est fait exprès pour que
    Safari sur iOS 10.3.3 (qui est très ancien) puisse tout exécuter
    sans planter.
  - Cherchez le mot "A CONFIGURER" dans les commentaires ci-dessous :
    ce sont tous les endroits où VOUS devez remplacer une valeur
    (identifiant d'agenda, etc.)
  ============================================================================
-->
<html lang="fr">
<head>
<meta charset="UTF-8">

<!-- AJOUTS MODE KIOSQUE POUR IOS 10.3.3 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Dashboard">

<!-- viewport fixe : on cible précisément l'écran 1024x768 de l'iPad 4 en paysage -->
<meta name="viewport" content="width=1024, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>✦ Dashboard ✦</title>

<style>
/* ==========================================================================
   RESET DE BASE
   ========================================================================== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  /* On désactive la sélection de texte façon "app" plutôt que "page web" */
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 1024px;
  height: 768px;
  overflow: hidden; /* pas de scroll : c'est un dashboard fixe sur un écran fixe */
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  color: #F2F2F2;
  /* Le dégradé de fond est en fait piloté par JavaScript (voir plus bas :
     la fonction updateBackground()), mais on met une valeur par défaut ici
     au cas où le JS mettrait du temps à démarrer. */
  background: linear-gradient(180deg, #362E68 0%, #0B0E28 100%);
  transition: background 3s ease; /* transition douce quand l'heure change de tranche */
}

/* ==========================================================================
   FOND ETOILE (ciel scintillant en CSS pur)
   ========================================================================== */
#stars-bg {
  position: fixed;
  top: 0; left: 0;
  width: 1024px;
  height: 768px;
  z-index: 0;
  pointer-events: none;
}

/* Chaque étoile est un petit <div class="star"> positionné en JS avec un
   style inline (top/left/taille/délai). Ici on ne définit que son look. */
.star {
  position: absolute;
  background: #FFFFFF;
  border-radius: 50%;
  opacity: 0.2;
  animation-name: twinkle;
  animation-timing-function: ease-in-out;
  animation-iteration-count: infinite;
}

@keyframes twinkle {
  0%   { opacity: 0.15; }
  50%  { opacity: 0.9; }
  100% { opacity: 0.15; }
}

/* ==========================================================================
   MISE EN PAGE GENERALE : titre en haut + 2 colonnes
   ========================================================================== */
.container {
  position: relative;
  z-index: 1;
  width: 1024px;
  height: 768px;
  padding: 12px 14px;
}

.dashboard-title {
  height: 48px;
  border: 1px solid rgba(255,255,255,0.25);
  background: rgba(0,0,0,0.35);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 23px;
  letter-spacing: 2px;
  font-weight: 500;
  color: #FFFFFF;
  margin-bottom: 10px;
}

.dashboard-columns {
  display: flex;
  flex-direction: row;
  height: 686px;
}

.col-left {
  width: 50%;
  display: flex;
  flex-direction: column;
  padding-right: 7px;
}

.col-right {
  width: 50%;
  display: flex;
  flex-direction: column;
  padding-left: 7px;
}

.widget {
  border: 1px solid rgba(255,255,255,0.25);
  background: rgba(0,0,0,0.35);
  border-radius: 10px;
  padding: 9px 11px;
  margin-bottom: 10px;
}

.widget-title {
  font-size: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #C7C7CC;
  margin-bottom: 6px;
  font-weight: 600;
}

/* DATE + HEURE */
.date-box {
  height: 62px;
  text-align: center;
}
.date-fr {
  font-size: 17px;
  color: #D0D0D5;
  letter-spacing: 0.6px;
  text-transform: capitalize;
}
.clock-box {
  height: 94px;
  text-align: center;
}
.clock {
  font-size: 58px;
  line-height: 64px;
  font-weight: 200;
  letter-spacing: 3px;
  color: #FFFFFF;
  font-variant-numeric: tabular-nums;
}

/* METEO + LUNE + SOLEIL */
.weather-moon-sun {
  height: 174px;
  display: flex;
  flex-direction: row;
}
.weather-panel, .moon-panel, .sun-panel {
  width: 33.333%;
  text-align: center;
}
.weather-panel, .moon-panel {
  border-right: 1px solid rgba(255,255,255,0.10);
}
.weather-main {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 58px;
}
.weather-temp {
  font-size: 34px;
  font-weight: 300;
}
.weather-icon {
  font-size: 30px;
  margin-left: 7px;
}
.weather-sub {
  font-size: 11px;
  color: #B5B5BA;
  line-height: 1.3;
  padding: 0 4px;
}
.moon-main {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  min-height: 82px;
}
.moon-emoji {
  font-size: 40px;
}
.moon-label {
  font-size: 11px;
  color: #B5B5BA;
  margin-top: 4px;
}
.sun-panel {
  padding-top: 4px;
}
.sun-time {
  font-size: 16px;
  color: #FFFFFF;
  margin: 18px 0 18px;
}
.sun-time span {
  display: block;
  font-size: 10px;
  color: #999;
  margin-bottom: 2px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
}

/* RAPPELS */
.widget.reminder {
  min-height: 64px;
  border-color: rgba(229,193,88,0.65);
  background: rgba(60,50,10,0.35);
  text-align: center;
  font-size: 17px;
  font-weight: bold;
  padding: 11px;
  display: none;
}

/* SHOPPING LIST */
.widget.shopping {
  flex: 1;
  min-height: 0;
  overflow: hidden;
}
.shopping-input{ display:flex; margin-bottom:10px; }
.shopping-input input{
  flex:1;
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:8px; padding:8px 12px;
  color:#fff; font-size:14px; outline:none;
  font-family:inherit;
  min-width:0;
}
.shopping-input input::placeholder{opacity:0.35;}
.shopping-input input:focus{border-color:rgba(255,255,255,0.35);}
.btn-add{
  background:rgba(255,255,255,0.15); border:none;
  border-radius:8px; color:#fff; font-size:18px;
  width:36px; height:36px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  margin-left:8px;
}
.shopping-list{
  list-style:none;
  max-height:210px;
  overflow-y:auto;
}
.shop-item{
  display:flex; align-items:center;
  padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.06);
  font-size:14px;
}
.shop-check{ width:18px; height:18px; accent-color:#a78bfa; cursor:pointer; margin-right:10px; }
.shop-item.done span{ text-decoration:line-through; opacity:0.35; }
.shop-item span{ flex:1; }
.btn-del{
  background:none; border:none; color:#fff;
  opacity:0.25; cursor:pointer; font-size:14px; padding:0 4px;
}
.shopping-status{ font-size:11px; color:#888; margin-top:5px; }

/* RADIOS */
.widget.audio {
  height: 128px;
}
.audio-buttons {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
}
.radio-btn {
  border: 1px solid rgba(255,255,255,0.3);
  background: rgba(255,255,255,0.05);
  color: #F2F2F2;
  font-size: 12px;
  padding: 7px 9px;
  border-radius: 6px;
  margin: 3px 5px 3px 0;
}
.radio-btn.active {
  background: #FFFFFF;
  color: #000000;
  border-color: #FFFFFF;
}
.audio-status { font-size: 11px; color: #999; margin-top: 5px; }

/* SPOTIFY */
.widget.spotify-box {
  height: 225px;
  overflow: hidden;
}
.spotify-embed {
  display: block;
  width: 100%;
  height: 190px;
  margin-top: 5px;
  border: 0;
  border-radius: 10px;
}
.spotify-config {
  font-size: 11px;
  color: #999;
  line-height: 1.4;
  margin-top: 5px;
}
.spotify-link {
  display: inline-block;
  margin-top: 6px;
  padding: 6px 10px;
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 6px;
  color: #fff;
  text-decoration: none;
  font-size: 11px;
}
</style>
</head>
<body>

  <!-- Le reste du HTML de votre Dashboard va ici (Inclus la div #stars-bg, .container etc.) -->

  <!-- BLOC SCRIPT DE CONFINEMENT KIOSQUE (A placer tout en bas de votre code) -->
  <script>
    // Empêche iOS 10 et Safari d'ouvrir une nouvelle page externe au clic sur un lien/bouton
    (function() {
      if (("standalone" in window.navigator) && window.navigator.standalone) {
        var noddy, remotes = false;
        document.addEventListener('click', function(event) {
          noddy = event.target;
          while (noddy.nodeName !== "A" && noddy.nodeName !== "HTML") {
            noddy = noddy.parentNode;
          }
          if ('href' in noddy && noddy.href.indexOf('http') !== -1 && (noddy.href.indexOf(document.location.host) !== -1 || remotes)) {
            event.preventDefault();
            document.location.href = noddy.href;
          }
        }, false);
      }
    })();
  </script>
</body>
</html>
