<!DOCTYPE html>
<!--
  ============================================================================
  DASHBOARD PERSONNEL POUR IPAD 4 (iOS 10.3.3 / Safari mobile ancien)
  ============================================================================
  Fichier 100% autonome : un seul index.html, prêt pour GitHub Pages.

  CE QUI CHANGE DANS CETTE VERSION (v3) :
  1) Colonnes asymétriques : gauche 40% / droite 60% (colonne de gauche
     plus étroite, au lieu de 50/50).
  2) L'encart de titre indépendant "Momo's Dashboard" est supprimé. Le
     widget Date et le widget Heure sont fusionnés en UN SEUL widget, qui
     réintègre discrètement "✦ Momo's Dashboard ✦" comme petit libellé
     au-dessus de la date et de l'heure.
  3) Fond dynamique CONTINU : au lieu d'un simple bascule jour/nuit à 6h
     et 18h, le dégradé s'éclaircit progressivement vers un bleu pastel
     lumineux (en haut) / violet doux (en bas) à mesure que l'heure se
     rapproche de midi (courbe en sinus centrée sur 12h, entre 6h et
     18h), puis se rassombrit progressivement le soir vers un bleu nuit
     profond (en haut) / violet très sombre (en bas). La logique
     "bleu en haut, violet en bas" est conservée à toute heure.
  4) L'agenda n'utilise PLUS d'iframe Google Calendar. Sur iOS < 13, le
     scroll tactile À L'INTÉRIEUR d'un iframe ne fonctionne quasiment
     jamais, ce qui coupait le contenu sans aucun moyen de le faire
     défiler. L'agenda est maintenant récupéré via le flux public .ics
     du calendrier (XMLHttpRequest), parsé en JavaScript ES5, puis
     affiché comme une liste HTML native — stylée comme le reste du
     dashboard, et qui défile normalement au doigt (-webkit-overflow-
     scrolling: touch).

     IMPORTANT — CORS : le fichier .ics de Google Calendar n'envoie pas
     d'en-tête Access-Control-Allow-Origin, donc un navigateur bloque un
     appel XHR direct depuis un autre domaine (ex: GitHub Pages). Pour
     contourner ça sans mettre en place son propre petit serveur, ce
     fichier passe par un proxy CORS public gratuit (allorigins.win) qui
     relaie le contenu du .ics avec les bons en-têtes. C'est la solution
     la plus simple, mais elle dépend de la disponibilité de ce service
     tiers et fait transiter le contenu de votre agenda par lui. Si vous
     préférez éviter ça, remplacez CORS_PROXY par votre propre petit
     proxy (ex: une Cloudflare Worker gratuite de 5 lignes) — l'endroit
     à modifier est marqué "A CONFIGURER" plus bas dans le script.
     Le calendrier doit aussi être réglé sur "Rendre disponible au
     public" dans les paramètres de partage Google Calendar, sinon le
     flux .ics répond une erreur.
  5) Limitation assumée du parseur ICS "maison" : les événements
     récurrents (RRULE) ne sont pas développés en plusieurs occurrences
     — seule la date de la définition d'origine est prise en compte.
     Pour un agenda familial affichant surtout des rendez-vous ponctuels,
     c'est un compromis raisonnable pour rester en pur ES5 sans
     dépendance externe.

  Reprend intégralement les correctifs de la version précédente : plus de
  plantage en cascade (chaque widget est isolé dans son propre try/catch),
  mise en page 100% Flexbox (aucun débordement possible), météo et RATP en
  ES5 pur, mode kiosque conservé.

  Cherchez "A CONFIGURER" pour les endroits à personnaliser.
  ============================================================================
-->
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1024, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>✦ Dashboard ✦</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Dashboard">

<style>
/* ==========================================================================
   RESET DE BASE
   ========================================================================== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

input, textarea {
  -webkit-user-select: text;
  user-select: text;
}
button, .shop-check, .radio-btn, .btn-del, .btn-add {
  cursor: pointer;
}

html, body {
  width: 1024px;
  height: 768px;
  overflow: hidden;
  font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: #F5F5F7;
  background: linear-gradient(180deg, #141E3C 0%, #190A28 100%);
  transition: background 3s ease;
}

/* ==========================================================================
   FOND ETOILE
   ========================================================================== */
#stars-bg {
  position: fixed;
  top: 0; left: 0;
  width: 1024px;
  height: 768px;
  z-index: 0;
  pointer-events: none;
}
.star {
  position: absolute;
  background: #FFFFFF;
  border-radius: 50%;
  opacity: 0.2;
  animation-name: twinkle;
  animation-timing-function: ease-in-out;
  animation-iteration-count: infinite;
}
@keyframes twinkle {
  0%   { opacity: 0.15; }
  50%  { opacity: 0.9; }
  100% { opacity: 0.15; }
}

/* ==========================================================================
   MISE EN PAGE GENERALE (Flexbox : l'espace restant est toujours absorbé
   par les widgets "flex", donc rien ne peut jamais déborder de l'écran)
   ========================================================================== */
.container {
  position: relative;
  z-index: 1;
  width: 1024px;
  height: 768px;
  padding: 14px;
  display: flex;
  flex-direction: column;
}

.dashboard-columns {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: row;
}

/* Colonne gauche plus étroite (40%), colonne droite plus large (60%) */
.col-left {
  width: 40%;
  min-width: 0;
  display: flex;
  flex-direction: column;
  padding-right: 7px;
}

.col-right {
  width: 60%;
  min-width: 0;
  display: flex;
  flex-direction: column;
  padding-left: 7px;
}

.widget {
  flex: 0 0 auto;
  border: 1px solid rgba(255,255,255,0.25);
  background: rgba(0,0,0,0.35);
  border-radius: 10px;
  padding: 10px 12px;
  margin-bottom: 8px;
}

.widget-title {
  font-size: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #C7C7CC;
  margin-bottom: 6px;
  font-weight: 600;
  text-align: center;
}

/* WIDGET FUSIONNÉ : libellé + date + heure */
.widget.brand-clock {
  text-align: center;
  padding: 14px 12px 12px;
}
.brand-label {
  font-size: 13px;
  letter-spacing: 2px;
  color: rgba(245,245,247,0.55);
  margin-bottom: 8px;
  text-align: center;
}
.date-fr {
  font-size: 18px;
  color: #E4E4E9;
  letter-spacing: 0.6px;
  text-transform: capitalize;
  text-align: center;
}
.clock {
  font-size: 66px;
  line-height: 70px;
  font-weight: 200;
  letter-spacing: 2px;
  color: #FFFFFF;
  font-variant-numeric: tabular-nums;
  text-align: center;
  margin-top: 4px;
}

/* METEO + LUNE + SOLEIL */
.weather-moon-sun {
  display: flex;
  flex-direction: row;
  padding-top: 12px;
  padding-bottom: 12px;
}
.weather-panel, .moon-panel, .sun-panel {
  width: 33.333%;
  text-align: center;
}
.weather-panel, .moon-panel {

}
.weather-main {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 4px;
}
.weather-temp { font-size: 36px; font-weight: 300; }
.weather-icon { font-size: 32px; margin-left: 8px; }
.weather-sub {
  font-size: 12px;
  color: #B5B5BA;
  line-height: 1.35;
  padding: 0 4px;
}
.moon-main {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}
.moon-emoji { font-size: 42px; }
.moon-label { font-size: 12px; color: #B5B5BA; margin-top: 6px; }
.sun-panel { padding-top: 2px; }
.sun-time {
  font-size: 17px;
  color: #FFFFFF;
  margin: 8px 0;

}
.sun-time span {

/* RAPPELS */

  background: rgba(60,50,10,0.35);
  text-align: center;
  font-size: 17px;

  display: none;
}

/* SHOPPING LIST (widget flexible : absorbe l'espace restant de la colonne) */
.widget.shopping {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
.shopping-input { display: flex; margin-bottom: 8px; flex: 0 0 auto; }
.shopping-input input {
  flex: 1;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 8px;
  padding: 9px 12px;
  color: #fff;
  font-size: 15px;
  outline: none;

}
.shopping-input input::placeholder { color: #C7C7CC; opacity: 0.45; }
.shopping-input input:focus { border-color: rgba(255,255,255,0.4); }
.btn-add {
  position: relative;
  background: rgba(255,255,255,0.15);
  border: none;
  border-radius: 8px;
  width: 38px;
  height: 38px;
  margin-left: 8px;
  flex: 0 0 auto;
}
/* Le "+" est dessiné avec deux barres en CSS pur plutôt qu'avec le
   caractère texte "+", dont le rendu (métriques de police, baseline)
   n'est jamais parfaitement centré sur tous les navigateurs — cette
   méthode donne un centrage pixel-parfait, y compris sur iOS 10. */
.btn-add::before, .btn-add::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  background: #fff;
}
.btn-add::before { width: 14px; height: 2px; margin: -1px 0 0 -7px; }
.btn-add::after { width: 2px; height: 14px; margin: -7px 0 0 -1px; }
.shopping-list {
  list-style: none;
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.shop-item {
  display: flex;
  align-items: center;
  padding: 7px 0;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  font-size: 15px;
}
.shop-check { width: 19px; height: 19px; accent-color: #a78bfa; margin-right: 10px; }
.shop-item.done span { text-decoration: line-through; opacity: 0.35; }
.shop-item span { flex: 1; }
.btn-del { background: none; border: none; color: #fff; opacity: 0.3; font-size: 15px; padding: 0 6px; }
.shopping-status { flex: 0 0 auto; font-size: 12px; color: #9A9AA0; margin-top: 6px; text-align: center; }

/* RADIOS */
.audio-buttons {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  justify-content: center;
}
.radio-btn {
  border: 1px solid rgba(255,255,255,0.3);
  background: rgba(255,255,255,0.06);
  color: #F5F5F7;
  font-size: 13px;
  padding: 8px 10px;
  border-radius: 6px;
  margin: 4px 5px;
}
.radio-btn.active { background: #FFFFFF; color: #000000; border-color: #FFFFFF; }
.audio-status { font-size: 12px; color: #9A9AA0; margin-top: 6px; text-align: center; }

/* SPOTIFY — lecteur intégré (plus de lien de secours externe) */
.spotify-embed {
  display: block;
  width: 100%;
  height: 176px;
  margin-top: 6px;
  border: 0;

}

/* METRO */
.metro-line {
  display: inline-block;
  background: #F5F5F7;
  color: #000;
  font-weight: bold;
  font-size: 12px;
  width: 20px;
  height: 20px;
  line-height: 20px;
  text-align: center;
  border-radius: 50%;
  margin-right: 8px;
}
.metro-direction { font-size: 13px; color: #E4E4E9; margin-top: 6px; text-align: center; }
.metro-times { font-size: 13px; color: #FFFFFF; margin-top: 3px; text-align: center; }
.metro-error { font-size: 12px; color: #9A9AA0; font-style: italic; text-align: center; }

/* AGENDA (widget flexible, liste HTML native — plus d'iframe) */
.widget.agenda {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  margin-bottom: 0;
}
#agenda-list {
  list-style: none;
  font-size: 13px;
  line-height: 1.5;
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
#agenda-list li {
  border-bottom: 1px solid rgba(255,255,255,0.08);
  padding: 6px 2px;
}
.agenda-day { display: inline-block; min-width: 46px; color: #E5C158; font-weight: 600; margin-right: 6px; }
.agenda-time { display: inline-block; min-width: 48px; color: #B5B5BA; margin-right: 6px; }
.agenda-empty, .agenda-error { font-size: 12px; color: #9A9AA0; font-style: italic; text-align: center; display: block; border-bottom: none !important; }

.deco-star { color: #C7C7CC; opacity: 0.8; }
</style>
</head>
<body>

<div id="stars-bg"></div>

<div class="container">

  <div class="dashboard-columns">
    <!-- ========================= COLONNE GAUCHE (60%) ========================= -->
    <div class="col-left">

      <div class="widget brand-clock">
        <div class="brand-label">✦ Momo's Dashboard ✦</div>
        <div class="date-fr" id="date-fr">--</div>

      <div class="widget shopping">

    <div class="col-right">

          <button class="radio-btn" id="btn-nova" onclick="playRadio('nova')">Radio Nova</button>
          <button class="radio-btn" id="btn-tsfjazz" onclick="playRadio('tsfjazz')">TSF Jazz</button>
          <button class="radio-btn" id="btn-fip" onclick="playRadio('fip')">FIP</button>

        <!-- A CONFIGURER : remplacez l'ID de playlist par une playlist
             PUBLIQUE (sinon l'iframe reste vide). Ce lecteur intégré

             le dashboard, sans quitter la page. -->

          src="https://open.spotify.com/playlist/6hMwxixqMwsbiLBqAly1GH?si=zwbKGs_7TCeVlYey5eSYBw"

<script>
/* ============================================================================
   TOUT LE JAVASCRIPT EST EN ES5 (compatible Safari iOS 10.3.3)
   Pas de let/const, pas de =>, pas de template strings, pas d'async/await,
   pas de fetch (XMLHttpRequest uniquement).
   ============================================================================ */


/* ----------------------------------------------------------------------
   0. UTILITAIRES GÉNÉRAUX
   ---------------------------------------------------------------------- */
function pad2(n) {
  n = Math.floor(n);
  if (n < 10) { return "0" + n; }
  return "" + n;
}

function xhrGetJSON(url, onSuccess, onError) {
  var xhr = new XMLHttpRequest();
  xhr.open("GET", url, true);
  xhr.timeout = 10000;
  xhr.onreadystatechange = function () {
    if (xhr.readyState === 4) {
      if (xhr.status >= 200 && xhr.status < 300) {
        var data;
        try {
          data = JSON.parse(xhr.responseText);
        } catch (parseErr) {
          if (onError) { onError(parseErr); }
          return;
        }
        try {
          onSuccess(data);
        } catch (renderErr) {
          if (onError) { onError(renderErr); }
        }
      } else {
        if (onError) { onError(new Error("HTTP " + xhr.status)); }
      }
    }
  };
  xhr.onerror = function () {
    if (onError) { onError(new Error("network error")); }
  };
  xhr.send();
}

// Variante qui récupère du texte brut (pas du JSON) : utilisée pour le
// flux .ics de l'agenda.
function xhrGetText(url, onSuccess, onError) {
  var xhr = new XMLHttpRequest();
  xhr.open("GET", url, true);
  xhr.timeout = 12000;
  xhr.onreadystatechange = function () {
    if (xhr.readyState === 4) {
      if (xhr.status >= 200 && xhr.status < 300) {
        try {
          onSuccess(xhr.responseText);
        } catch (renderErr) {
          if (onError) { onError(renderErr); }
        }
      } else {
        if (onError) { onError(new Error("HTTP " + xhr.status)); }
      }
    }
  };
  xhr.onerror = function () {
    if (onError) { onError(new Error("network error")); }
  };
  xhr.send();
}

function escapeHtml(text) {
  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}


/* ----------------------------------------------------------------------
   1. CIEL ETOILE (généré une seule fois au chargement)
   ---------------------------------------------------------------------- */
function buildStars() {
  var container = document.getElementById("stars-bg");
  var starCount = 70;
  var html = "";
  var i;
  for (i = 0; i < starCount; i++) {
    var size = Math.random() * 2 + 1;
    var top = Math.random() * 768;
    var left = Math.random() * 1024;
    var duration = (Math.random() * 3 + 2).toFixed(1);
    var delay = (Math.random() * 4).toFixed(1);
    html += '<div class="star" style="' +
      "width:" + size + "px;" +
      "height:" + size + "px;" +
      "top:" + top + "px;" +
      "left:" + left + "px;" +
      "animation-duration:" + duration + "s;" +
      "animation-delay:" + delay + "s;" +
      '"></div>';
  }
  container.innerHTML = html;
}


/* ----------------------------------------------------------------------
   2. DATE FRANÇAISE + HORLOGE
   ---------------------------------------------------------------------- */
var JOURS_FR = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
var JOURS_ABBR = ["Dim", "Lun", "Mar", "Mer", "Jeu", "Ven", "Sam"];
var MOIS_FR = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet",
                "août", "septembre", "octobre", "novembre", "décembre"];

function updateClockAndDate() {
  var now = new Date();

  var dateStr = JOURS_FR[now.getDay()] + " " + now.getDate() + " " +
                MOIS_FR[now.getMonth()] + " " + now.getFullYear();
  document.getElementById("date-fr").innerHTML = dateStr;

  var timeStr = pad2(now.getHours()) + ":" + pad2(now.getMinutes()) + ":" + pad2(now.getSeconds());
  document.getElementById("clock").innerHTML = timeStr;

  return now;
}


/* ----------------------------------------------------------------------
   2bis. FOND DYNAMIQUE CONTINU
   ----------------------------------------------------------------------
   Au lieu d'un simple bascule jour/nuit, on calcule un "facteur de
   luminosité" entre 0 et 1 : 0 avant 6h et après 18h, montant en douceur
   (courbe en sinus) jusqu'à 1 à midi pile, puis redescendant en douceur
   vers le soir. On interpole ensuite linéairement, canal par canal,
   entre une couleur de nuit et une couleur de plein jour bleu clair.
   ---------------------------------------------------------------------- */
// Palette "bleu pastel en haut / violet en bas", du plus sombre (nuit) au
// plus clair et lumineux (plein midi).
var NIGHT_TOP = [20, 30, 60];      // #141E3C — bleu nuit profond
var NIGHT_BOTTOM = [25, 10, 40];   // #190A28 — violet très sombre
var DAY_TOP = [180, 225, 250];     // #B4E1FA — bleu pastel lumineux
var DAY_BOTTOM = [155, 120, 210];  // #9B78D2 — violet doux

function daylightFactor(now) {
  var hour = now.getHours() + now.getMinutes() / 60;
  if (hour <= 6 || hour >= 18) { return 0; }
  var t = (hour - 6) / 12; // 0 à 6h, 1 à 18h
  return Math.sin(Math.PI * t); // pic à midi (t = 0.5)
}

function lerpChannel(a, b, t) {
  return Math.round(a + (b - a) * t);
}

function updateBackground() {
  var now = new Date();
  var f = daylightFactor(now);
  var top = [
    lerpChannel(NIGHT_TOP[0], DAY_TOP[0], f),
    lerpChannel(NIGHT_TOP[1], DAY_TOP[1], f),
    lerpChannel(NIGHT_TOP[2], DAY_TOP[2], f)
  ];
  var bottom = [
    lerpChannel(NIGHT_BOTTOM[0], DAY_BOTTOM[0], f),
    lerpChannel(NIGHT_BOTTOM[1], DAY_BOTTOM[1], f),
    lerpChannel(NIGHT_BOTTOM[2], DAY_BOTTOM[2], f)
  ];
  document.body.style.background =
    "linear-gradient(180deg, rgb(" + top.join(",") + ") 0%, rgb(" + bottom.join(",") + ") 100%)";
}

function checkReminder(now) {
  var day = now.getDay();
  var hour = now.getHours();
  var block = document.getElementById("reminder-block");
  var message = null;

  if (day === 1 && hour >= 6 && hour < 12) {
    message = "✦ Prends ta B12 ✦";
  } else if (day === 5 && hour >= 6 && hour < 12) {
    message = "✦ Arrose les plantes ✦";
  }

  if (message) {
    block.innerHTML = message;
    block.style.display = "block";
  } else {
    block.style.display = "none";
  }
}


/* ----------------------------------------------------------------------
   4. AGENDA — flux .ics public, parsé en ES5 (plus d'iframe)
   ---------------------------------------------------------------------- */

// A CONFIGURER : le calendrier doit être "disponible au public" dans les
// paramètres de partage Google Calendar, sinon ce flux répond une erreur.
var CALENDAR_ICS_URL = "https://calendar.google.com/calendar/ical/morgane.bonvin%40gmail.com/public/basic.ics";

// A CONFIGURER : proxy CORS gratuit utilisé pour contourner l'absence
// d'en-têtes CORS sur le flux .ics de Google (voir le commentaire en
// haut du fichier). Remplacez par votre propre proxy si vous préférez
// ne pas dépendre d'un service tiers.
var CORS_PROXY = "https://api.allorigins.win/raw?url=";

function unfoldICSLines(text) {
  var rawLines = text.split(/\r\n|\n|\r/);
  var lines = [];
  var i;
  for (i = 0; i < rawLines.length; i++) {
    var line = rawLines[i];
    if ((line.charAt(0) === " " || line.charAt(0) === "\t") && lines.length) {
      lines[lines.length - 1] += line.substr(1);
    } else {
      lines.push(line);
    }
  }
  return lines;
}

function splitICSProperty(line) {
  var idx = line.indexOf(":");
  if (idx === -1) { return null; }
  var left = line.substr(0, idx);
  var value = line.substr(idx + 1);
  var nameEnd = left.indexOf(";");
  var name = nameEnd === -1 ? left : left.substr(0, nameEnd);
  var params = nameEnd === -1 ? "" : left.substr(nameEnd + 1);
  return { name: name.toUpperCase(), params: params, value: value };
}

function unescapeICSText(v) {
  return String(v)
    .replace(/\\n/gi, " ")
    .replace(/\\,/g, ",")
    .replace(/\\;/g, ";")
    .replace(/\\\\/g, "\\");
}

function parseICSDateValue(params, value) {
  var digits = value.replace(/[^0-9TZ]/g, "");
  var isDateOnly = params.indexOf("VALUE=DATE") !== -1 && digits.indexOf("T") === -1;
  var y = parseInt(digits.substr(0, 4), 10);
  var mo = parseInt(digits.substr(4, 2), 10);
  var d = parseInt(digits.substr(6, 2), 10);

  if (isDateOnly) {
    return { date: new Date(y, mo - 1, d), allDay: true };
  }

  var h = parseInt(digits.substr(9, 2), 10) || 0;
  var mi = parseInt(digits.substr(11, 2), 10) || 0;
  var s = parseInt(digits.substr(13, 2), 10) || 0;
  var isUTC = digits.charAt(digits.length - 1) === "Z";
  var dt;
  if (isUTC) {
    dt = new Date(Date.UTC(y, mo - 1, d, h, mi, s));
  } else {
    dt = new Date(y, mo - 1, d, h, mi, s);
  }
  return { date: dt, allDay: false };
}

// Parseur .ics volontairement simple : extrait SUMMARY/DTSTART/DTEND de
// chaque VEVENT. Les événements récurrents (RRULE) ne sont PAS développés
// en plusieurs occurrences (limitation assumée, voir commentaire en haut
// du fichier).
function parseICS(text) {
  var lines = unfoldICSLines(text);
  var events = [];
  var current = null;
  var i;

  for (i = 0; i < lines.length; i++) {
    var line = lines[i];

    if (line === "BEGIN:VEVENT") {
      current = {};
      continue;
    }
    if (line === "END:VEVENT") {
      if (current && current.start) { events.push(current); }
      current = null;
      continue;
    }
    if (!current) { continue; }

    var prop = splitICSProperty(line);
    if (!prop) { continue; }

    if (prop.name === "SUMMARY") {
      current.summary = unescapeICSText(prop.value);
    } else if (prop.name === "DTSTART") {
      current.start = parseICSDateValue(prop.params, prop.value);
    } else if (prop.name === "DTEND") {
      current.end = parseICSDateValue(prop.params, prop.value);
    }
  }

  return events;
}

function renderAgenda(icsText) {
  var listEl = document.getElementById("agenda-list");
  var events = parseICS(icsText);
  var now = new Date();
  var startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  var upcoming = [];
  var i;
  for (i = 0; i < events.length; i++) {
    if (events[i].start && events[i].start.date.getTime() >= startOfToday.getTime()) {
      upcoming.push(events[i]);
    }
  }

  upcoming.sort(function (a, b) {
    return a.start.date.getTime() - b.start.date.getTime();
  });
  upcoming = upcoming.slice(0, 12);

  if (!upcoming.length) {
    listEl.innerHTML = '<li class="agenda-empty">Aucun événement à venir</li>';
    return;
  }

  var html = "";
  for (i = 0; i < upcoming.length; i++) {
    var ev = upcoming[i];
    var d = ev.start.date;
    var dayLabel = JOURS_ABBR[d.getDay()] + " " + d.getDate();
    var timeLabel = ev.start.allDay ? "Journée" : (pad2(d.getHours()) + ":" + pad2(d.getMinutes()));
    // NOTE : si le calendrier est partagé en "Voir uniquement la
    // disponibilité", Google renvoie littéralement "Busy" à la place du
    // vrai titre DANS LE FLUX .ICS LUI-MÊME, avant même que ce script ne
    // le reçoive. Aucune logique de parsing ne peut donc récupérer un
    // titre qui n'est jamais transmis — la seule vraie correction est le
    // réglage de confidentialité du calendrier (voir l'explication
    // fournie avec le code). On se contente ici de franciser l'affichage.
    var rawSummary = ev.summary ? ev.summary.replace(/^\s+|\s+$/g, "") : "";
    var summary;
    if (!rawSummary) {
      summary = "(Sans titre)";
    } else if (rawSummary.toLowerCase() === "busy") {
      summary = "Occupé <span style=\"opacity:0.5;font-size:11px;\">(détails masqués)</span>";
    } else {
      summary = escapeHtml(rawSummary);
    }
    html += '<li><span class="agenda-day">' + dayLabel + '</span>' +
      '<span class="agenda-time">' + timeLabel + '</span>' +
      summary + '</li>';
  }
  listEl.innerHTML = html;
}

function refreshAgenda() {
  var listEl = document.getElementById("agenda-list");
  var target = CORS_PROXY + encodeURIComponent(CALENDAR_ICS_URL);

  xhrGetText(
    target,
    function (text) {
      renderAgenda(text);
    },
    function () {
      listEl.innerHTML = '<li class="agenda-error">Agenda indisponible pour le moment</li>';
    }
  );
}


/* ----------------------------------------------------------------------
   5. SHOPPING LIST LOCALE (localStorage — fonctionne hors-ligne)
   ---------------------------------------------------------------------- */
var SHOPPING_STORAGE_KEY = "dashboard-shopping-list";

function loadShoppingItems() {
  var raw = null;
  try { raw = localStorage.getItem(SHOPPING_STORAGE_KEY); } catch (e) {}
  if (!raw) { return []; }
  try {
    var data = JSON.parse(raw);
    return (data && data.length) ? data : [];
  } catch (e2) {
    return [];
  }
}

function saveShoppingItems(items) {
  try { localStorage.setItem(SHOPPING_STORAGE_KEY, JSON.stringify(items)); } catch (e) {}
}

function renderShoppingList() {
  var listEl = document.getElementById("shop-list");
  var statusEl = document.getElementById("shopping-status");
  var items = loadShoppingItems();
  var html = "";
  var i;

  if (!items.length) {
    listEl.innerHTML = '<li class="shopping-status">Aucun article</li>';
  } else {
    for (i = 0; i < items.length; i++) {
      var item = items[i];
      var doneClass = item.done ? " done" : "";
      html += '<li class="shop-item' + doneClass + '">' +
        '<input class="shop-check" type="checkbox" ' +
        (item.done ? 'checked="checked" ' : '') +
        'onclick="toggleItem(' + i + ')">' +
        '<span>' + escapeHtml(item.text) + '</span>' +
        '<button class="btn-del" onclick="deleteItem(' + i + ')">✕</button>' +
        '</li>';
    }
    listEl.innerHTML = html;
  }

  statusEl.innerHTML = items.length + (items.length > 1 ? " articles" : " article");
}

function addItem() {
  var input = document.getElementById("shop-input");
  var text = input.value.replace(/^\s+|\s+$/g, "");
  if (!text) { input.focus(); return; }

  var items = loadShoppingItems();
  items.push({ text: text, done: false });
  saveShoppingItems(items);
  input.value = "";
  renderShoppingList();
  input.focus();
}

function toggleItem(index) {
  var items = loadShoppingItems();
  if (!items[index]) { return; }
  items[index].done = !items[index].done;
  saveShoppingItems(items);
  renderShoppingList();
}

function deleteItem(index) {
  var items = loadShoppingItems();
  if (!items[index]) { return; }
  items.splice(index, 1);
  saveShoppingItems(items);
  renderShoppingList();
}

function initShoppingList() {
  renderShoppingList();
  var input = document.getElementById("shop-input");
  input.onkeypress = function (event) {
    event = event || window.event;
    if (event.keyCode === 13) {
      addItem();
      return false;
    }
  };
}

   6. METEO & LUNE (Open-Meteo, aucune clé API nécessaire)

// A CONFIGURER si besoin : coordonnées par défaut = Paris.
var WEATHER_LAT = 48.8566;
var WEATHER_LON = 2.3522;

function decodeWeatherCode(code) {
  var table = {
    0: { icon: "☀️", label: "Ciel dégagé" },
    1: { icon: "🌤️", label: "Plutôt dégagé" },
    2: { icon: "⛅", label: "Partiellement nuageux" },
    3: { icon: "☁️", label: "Couvert" },
    45: { icon: "🌫️", label: "Brouillard" },
    48: { icon: "🌫️", label: "Brouillard givrant" },
    51: { icon: "🌦️", label: "Bruine légère" },
    53: { icon: "🌦️", label: "Bruine" },
    55: { icon: "🌦️", label: "Bruine forte" },
    61: { icon: "🌧️", label: "Pluie légère" },
    63: { icon: "🌧️", label: "Pluie" },
    65: { icon: "🌧️", label: "Pluie forte" },
    71: { icon: "🌨️", label: "Neige légère" },
    73: { icon: "🌨️", label: "Neige" },
    75: { icon: "❄️", label: "Neige forte" },
    80: { icon: "🌦️", label: "Averses" },
    81: { icon: "🌦️", label: "Averses fortes" },
    95: { icon: "⛈️", label: "Orage" },
    96: { icon: "⛈️", label: "Orage + grêle" },
    99: { icon: "⛈️", label: "Orage violent" }
  };
  if (table[code]) { return table[code]; }
  return { icon: "❓", label: "Inconnu" };
}

function refreshWeather() {
  var url = "https://api.open-meteo.com/v1/forecast?latitude=" + WEATHER_LAT +
    "&longitude=" + WEATHER_LON +
    "&current_weather=true" +
    "&daily=sunrise,sunset" +
    "&timezone=Europe%2FParis";

  xhrGetJSON(
    url,
    function (data) {
      if (data.current_weather) {
        var temp = Math.round(data.current_weather.temperature);
        var code = data.current_weather.weathercode;
        var info = decodeWeatherCode(code);
        document.getElementById("weather-temp").innerHTML = temp + "°";
        document.getElementById("weather-icon").innerHTML = info.icon;
        document.getElementById("weather-desc").innerHTML = info.label;
      }
      if (data.daily && data.daily.sunrise && data.daily.sunrise[0]) {
        var sunrise = data.daily.sunrise[0].substr(11, 5);
        var sunset = data.daily.sunset[0].substr(11, 5);
        document.getElementById("sun-rise").innerHTML = "☀️ " + sunrise;
        document.getElementById("sun-set").innerHTML = "🌙 " + sunset;
      }
    },
    function () {
      document.getElementById("weather-desc").innerHTML = "Météo indisponible";
    }
  );
}

function getMoonPhase(date) {
  var synodicMonth = 29.530588853;
  var knownNewMoon = Date.UTC(2000, 0, 6, 18, 14, 0);
  var diffDays = (date.getTime() - knownNewMoon) / 86400000;
  var phase = diffDays % synodicMonth;
  if (phase < 0) { phase += synodicMonth; }
  var fraction = phase / synodicMonth;

  var emojis = ["🌑", "🌒", "🌓", "🌔", "🌕", "🌖", "🌗", "🌘"];
  var labels = ["Nouvelle lune", "Premier croissant", "Premier quartier",
                "Gibbeuse croissante", "Pleine lune", "Gibbeuse décroissante",
                "Dernier quartier", "Dernier croissant"];

  var index = Math.floor(fraction * 8 + 0.5) % 8;
  return { emoji: emojis[index], label: labels[index] };
}

function refreshMoon() {
  var moon = getMoonPhase(new Date());
  document.getElementById("moon-emoji").innerHTML = moon.emoji;
  document.getElementById("moon-label").innerHTML = moon.label;
}


/* ----------------------------------------------------------------------
   7. TRANSPORTS RATP (métro ligne 2, station Philippe Auguste)
   ---------------------------------------------------------------------- */
var RATP_URL = "https://api-ratp.pierre-grimaud.fr/v4/schedules/metros/2/philippe+auguste/A+R";

function refreshRatp() {
  var container = document.getElementById("ratp-content");
  container.innerHTML = '<div class="metro-error">Chargement des horaires…</div>';

  xhrGetJSON(
    RATP_URL,
    function (data) {
      if (!data.result || !data.result.schedules || !data.result.schedules.length) {
        container.innerHTML = '<div class="metro-error">Horaires indisponibles pour le moment</div>';
        return;
      }

      var schedules = data.result.schedules;
      var groups = {};
      var order = [];
      var i;

      for (i = 0; i < schedules.length; i++) {
        var dest = schedules[i].destination || "Direction inconnue";
        if (!groups[dest]) {
          groups[dest] = [];
          order.push(dest);
        }
        if (schedules[i].message) {
          groups[dest].push(escapeHtml(schedules[i].message));
        }
      }

      var html = "";
      for (i = 0; i < order.length; i++) {
        var d = order[i];
        if (!groups[d].length) { continue; }
        html += '<div class="metro-direction"><span class="metro-line">2</span>' +
          escapeHtml(d) + '</div>' +
          '<div class="metro-times">' + groups[d].join(" &nbsp;•&nbsp; ") + '</div>';
      }

      container.innerHTML = html || '<div class="metro-error">Horaires indisponibles pour le moment</div>';
    },
    function () {
      container.innerHTML = '<div class="metro-error">Horaires indisponibles pour le moment</div>';
    }
  );
}


/* ----------------------------------------------------------------------
   8. AUDIO / RADIOS EN DIRECT
   ---------------------------------------------------------------------- */
var RADIO_LABELS = {
  nova: "Radio Nova",
  tsfjazz: "TSF Jazz",
  fip: "Fip",
  inter: "France Inter"
};

var RADIO_STREAMS = {
  nova: "https://novazz.ice.infomaniak.ch/novazz-128.mp3",
  tsfjazz: "https://tsfjazz.ice.infomaniak.ch/tsfjazz-high.mp3",
  fip: "https://icecast.radiofrance.fr/fip-midfi.mp3",
  inter: "https://icecast.radiofrance.fr/franceinter-midfi.mp3"
};

function clearActiveButtons() {
  var ids = ["btn-nova", "btn-tsfjazz", "btn-fip", "btn-inter"];
  var i;
  for (i = 0; i < ids.length; i++) {
    document.getElementById(ids[i]).className = "radio-btn";
  }
}

function startPlayback(key) {
  var player = document.getElementById("radio-player");
  var statusEl = document.getElementById("audio-status");
  var url = RADIO_STREAMS[key];

  clearActiveButtons();

  player.onerror = function () {
    statusEl.innerHTML = "Erreur de lecture pour " + RADIO_LABELS[key];
    clearActiveButtons();
  };

  player.src = url;

  var result = player.play();
  if (result && typeof result.catch === "function") {
    result.catch(function () {
      statusEl.innerHTML = "Lecture bloquée — touchez à nouveau " + RADIO_LABELS[key];
      clearActiveButtons();
    });
  }

  var btn = document.getElementById("btn-" + key);
  if (btn) { btn.className = "radio-btn active"; }

  statusEl.innerHTML = "En cours : " + RADIO_LABELS[key];
}

function playRadio(key) {
  if (!RADIO_STREAMS[key]) { return; }
  startPlayback(key);
}

function stopRadio() {
  var player = document.getElementById("radio-player");
  player.pause();
  player.removeAttribute("src");
  player.load();
  player.onerror = null;
  clearActiveButtons();
  document.getElementById("audio-status").innerHTML = "Aucune radio en cours";
}


/* ----------------------------------------------------------------------
   9. INITIALISATION GENERALE
   ----------------------------------------------------------------------
   Chaque étape est isolée dans son propre try/catch : si un widget
   rencontre un problème, il ne bloque jamais l'initialisation des
   autres.
   ---------------------------------------------------------------------- */
function safeRun(fn, label) {
  try {
    fn();
  } catch (e) {
    if (window.console && console.error) {
      console.error("Erreur dans " + label + " :", e);
    }
  }
}

function initDashboard() {
  safeRun(buildStars, "buildStars");

  safeRun(function () {
    var now = updateClockAndDate();
    checkReminder(now);
    setInterval(function () {
      var n = updateClockAndDate();
      checkReminder(n);
    }, 1000);
  }, "horloge");

  safeRun(function () {
    updateBackground();
    setInterval(updateBackground, 60000);
  }, "fond dynamique");

  safeRun(function () {
    initShoppingList();
  }, "liste de courses");

  safeRun(function () {
    refreshWeather();
    setInterval(refreshWeather, 15 * 60 * 1000);
  }, "météo");

  safeRun(function () {
    refreshMoon();
    setInterval(refreshMoon, 60 * 60 * 1000);
  }, "lune");

  safeRun(function () {
    refreshRatp();
    setInterval(refreshRatp, 60000);
  }, "RATP");

  safeRun(function () {
    refreshAgenda();
    setInterval(refreshAgenda, 5 * 60 * 1000);
  }, "agenda");
}

document.addEventListener("DOMContentLoaded", function () {
  initDashboard();
});
